name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Jobs run on the self-hosted Ampere runner (Linux ARM64, labels self-hosted/linux/arm64/ampere,
# org runner group limited to this repository). Set the repository variable CI_RUNNER=github
# to move them back to GitHub-hosted ubuntu-latest. Deploys are unaffected: Cloudflare Workers
# Builds deploys main independently of GitHub Actions.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Type-check and build
    runs-on: ${{ vars.CI_RUNNER == 'github' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","arm64","ampere"]') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      # The Workers Builds gate runs this too; checking it here catches an unregistered route before merge, not after.
      - name: Every route is registered in the boundary audit
        run: node tests/boundary-audit.mjs
      # Outside every verify profile (WH-054), so only this step stops an unreviewed dynamic tenant SQL site; about 1 s.
      - name: Every dynamic SQL site is in the tenant allowlist
        run: node tests/tenant-sql-surface.mjs
      - name: Roadmap backlog is in sync
        run: node tools/roadmap.mjs validate && node tools/roadmap.mjs render --check

  secrets:
    name: Secret scan
    runs-on: ${{ vars.CI_RUNNER == 'github' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","arm64","ampere"]') }}
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      GITLEAKS_SHA256_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install gitleaks
        run: |
          case "$RUNNER_ARCH" in
            X64) arch=x64 sha="$GITLEAKS_SHA256_X64" ;;
            ARM64) arch=arm64 sha="$GITLEAKS_SHA256_ARM64" ;;
            *) echo "Unsupported runner architecture: $RUNNER_ARCH" >&2; exit 1 ;;
          esac
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          echo "${sha}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Scan working tree
        run: ./gitleaks detect --no-banner --redact --config .gitleaks.toml --source . --no-git
