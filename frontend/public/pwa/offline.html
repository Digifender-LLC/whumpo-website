<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F8FAFC">
  <title>Reconnect to Whumpo</title>
  <link rel="stylesheet" href="/pwa/offline.css">
  <script src="/pwa/offline.js" defer></script>
</head>
<body>
  <main>
    <img src="/brand/whumpo-mark-96.png" alt="" width="80" height="80">
    <p class="brand">Whumpo</p>
    <h1>A little pause.<br>We’ll be right here.</h1>
    <p>We couldn’t connect to your workspace. Check your connection, then try again.</p>
    <button type="button" id="reconnect">Try again</button>
    <p class="hint">Your saved projects will be here when you reconnect.</p>
  </main>
</body>
</html>
