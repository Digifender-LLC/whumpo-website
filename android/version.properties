# Release version scheme, read by androidApp/build.gradle.kts. See docs/android/release-checklist.md.
# versionName: bump by hand for each user-visible release (semantic: major.minor.patch).
versionName=0.1.0
# versionCode = versionCodeBase + CI run number of the "Android" workflow. Raise the base (never lower it) if the
# workflow is ever recreated and its run number restarts, so Play always sees a higher code.
versionCodeBase=0
